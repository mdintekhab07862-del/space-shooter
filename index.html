<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Space Shooter 🌌</title>
<style>
:root{box-sizing:border-box;--bg:#050816;--fg:#fff;--accent:#ffd54a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050816;--fg:#fff}}
:root[data-theme="dark"]{--bg:#050816;--fg:#fff}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Noto Sans Devanagari",sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;display:block;width:100%;height:100%}
#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;font-weight:700;font-size:16px;pointer-events:none}
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(5,8,22,.85);text-align:center;padding:20px}
#menu h1{margin:0;font-size:30px}
#menu p{margin:0;opacity:.85;line-height:1.5}
#go{display:flex;flex-direction:column;gap:10px;width:240px}
button{background:var(--accent);color:#111;border:0;border-radius:28px;padding:14px 34px;font-size:18px;font-weight:700}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#050816">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="sc">Score: 0</span><span id="lv">Level: 1</span><span id="hp">❤️❤️❤️</span></div>
<div id="menu"><h1>🚀 Space Shooter 🌌</h1><p id="msg">Drag your finger to move the ship.<br>Bullets fire automatically!<br>Shoot the enemies 👾 | ⚡ Rapid fire, 🛡️ Shield<br>A boss 👹 arrives every 3 levels!</p><div id="go"><button data-d="0">🟢 Normal</button><button data-d="1">🟠 Hard</button><button data-d="2">🔴 Extreme</button></div><button id="fsb" style="background:#fff;font-size:15px;padding:10px 24px">⛶ Fullscreen</button></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
let W,H,D=Math.min(devicePixelRatio||1,2);
function rs(){W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0)}
rs();addEventListener('resize',rs);
let ship,bul,en,par,stars,score,lives,level,run=false,last=0,fireT=0,spawnT=0,inv=0,best=0,pw=[],eb=[],boss=null,bossLv=0,rapid=0,ac=null,tm=0,ban=0,lvPrev=1,df,CF=[{l:3,s:1,sp:1,h:1,sh:.9,es:0,lg:.127,vd:.073,ex:99,mn:.3},{l:3,s:1.2,sp:.85,h:1.2,sh:.8,es:.25,lg:.127,vd:.073,ex:99,mn:.3,cap:4,bg:1},{l:2,s:1.3,sp:.6,h:2.1,sh:.45,es:1.1,lg:.17,vd:.085,ex:4,mn:.25,cap:5,bg:1.5}];
stars=Array.from({length:70},()=>({x:Math.random()*2000,y:Math.random()*2000,s:Math.random()*2+.5}));
function init(){ship={x:W/2,y:H-110,tx:W/2,ty:H-110};bul=[];en=[];par=[];pw=[];eb=[];boss=null;bossLv=0;rapid=0;score=0;lives=df.l;level=1;lvPrev=1;ban=2.2;fireT=0;spawnT=0;inv=0;hud()}
function snd(f,d,t){if(!ac)return;try{const o=ac.createOscillator(),g=ac.createGain();o.type=t||'square';o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function hud(){sc.textContent='Score: '+score;lv.textContent='Level: '+level;if(level!=lvPrev){lvPrev=level;ban=2.2;snd(520,.25,'sine')}hp.textContent='❤️'.repeat(Math.max(lives,0))}
function mv(e){const r=cv.getBoundingClientRect();ship.tx=e.clientX-r.left;ship.ty=Math.min(e.clientY-r.top-60,H-70)}
cv.addEventListener('pointerdown',e=>{if(run)mv(e)});
cv.addEventListener('pointermove',e=>{if(run)mv(e)});
function fs(){const e=document.documentElement,f=e.requestFullscreen||e.webkitRequestFullscreen;if(f)try{const r=f.call(e);if(r&&r.catch)r.catch(()=>{})}catch(_){}}
fsb.onclick=fs;
go.onclick=e=>{const b=e.target.closest('button');if(!b)return;fs();df=CF[+b.dataset.d];if(!ac)try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}init();menu.style.display='none';run=true;last=performance.now();requestAnimationFrame(loop)};
function boom(px,py,col){for(let i=0;i<14;i++){const a=Math.random()*6.28,s=Math.random()*180+40;par.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5,c:col})}}
function spawn(){const t=Math.random()<.25+level*.03?1:0;const r=t?14:20;en.push({x:r+Math.random()*(W-2*r),y:-30-Math.random()*60,r,t,hp:t?1:Math.round(2*df.h),vy:(t?190:110)*df.s*(1+(level-1)*df.lg),ph:Math.random()*6,ft:1+Math.random()*2})}
function loop(n){
 if(!run)return;
 const dt=Math.min((n-last)/1000,.05);last=n;
 ship.x+=(ship.tx-ship.x)*Math.min(dt*14,1);ship.y+=(ship.ty-ship.y)*Math.min(dt*14,1);
 fireT-=dt;rapid-=dt;if(fireT<=0){fireT=rapid>0?.1:(df.fr||.2);snd(660,.05);{const n=Math.min(level+(df.eg||0),df.cap||6),p2=level>=7?2:1;for(let i=0;i<n;i++){const o=i-(n-1)/2;bul.push({x:ship.x+o*11,y:ship.y-24+Math.abs(o)*4,vx:n>3?o*38:0,p:p2})}}}
 spawnT-=dt;if(spawnT<=0){for(let i=0,n=1+Math.floor((level-1)/df.ex);i<n;i++)spawn();spawnT=Math.max(df.mn,1.1*df.sp*(1-(level-1)*df.vd))}
 inv-=dt;
 if(level%3==0&&bossLv!=level&&!boss){bossLv=level;boss={x:W/2,y:-60,r:48,hp:Math.round((25+level*4)*df.h*(1+(df.bg||0)*(Math.floor(level/3)-1)*.6)*(df.bg&&level>=9?1.4:1)),m:0,d:1,ft:1,bk:Math.floor(level/3)};boss.m=boss.hp}
 if(boss){boss.y=Math.min(boss.y+60*dt,110);boss.x+=boss.d*(df.bg&&boss.bk>=3?170:110)*dt;if(boss.x>W-50)boss.d=-1;if(boss.x<50)boss.d=1;boss.ft-=dt;if(boss.ft<=0){boss.ft=Math.max(.25,df.sh-(df.bg||0)*(boss.bk-1)*.12-(df.bg&&boss.bk>=3?.1:0));for(const a of df.bg&&boss.bk>=3?[-.8,-.6,-.4,-.2,0,.2,.4,.6,.8]:df.es>.5||(df.bg&&boss.bk>=2)?[-.5,-.25,0,.25,.5]:[-.3,0,.3])eb.push({x:boss.x,y:boss.y+40,vx:Math.sin(a)*200,vy:Math.cos(a)*240*(1+(df.bg||0)*(boss.bk-1)*.12)*(df.bg&&boss.bk>=3?1.1:1)})}}
 eb.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});eb=eb.filter(b=>b.y<H+20);
 pw.forEach(p=>p.y+=110*dt);pw=pw.filter(p=>p.y<H+20);
 if(inv<=0)for(const b of eb)if(Math.hypot(b.x-ship.x,b.y-ship.y)<20){b.y=H+99;hit();if(!run)return;break}
 for(const p of pw)if(Math.hypot(p.x-ship.x,p.y-ship.y)<30){p.y=H+99;snd(900,.2,'sine');if(p.t=='f')rapid=6;else if(p.t=='s')inv=4;else{lives=Math.min(lives+1,5);hud()}}
 bul.forEach(b=>{b.y-=640*dt;b.x+=(b.vx||0)*dt});bul=bul.filter(b=>b.y>-20);
 en.forEach(e=>{e.y+=e.vy*dt;if(e.t)e.x+=Math.sin(e.y/40+e.ph)*90*dt;e.ft-=dt;if(df.es&&e.ft<=0&&e.y>0&&e.y<H*.6){e.ft=2.6/df.es+Math.random();eb.push({x:e.x,y:e.y+e.r,vx:0,vy:260})}});
 for(const e of en){
  for(const b of bul){if(!b.d&&Math.abs(b.x-e.x)<e.r&&Math.abs(b.y-e.y)<e.r+6){b.d=1;e.hp-=b.p||1;if(e.hp<=0){e.dead=1;snd(200,.1);if(Math.random()<.14)pw.push({x:e.x,y:e.y,t:Math.random()<.5?'f':'s'});score+=e.t?15:10;boom(e.x,e.y,e.t?'#ff6b6b':'#7dff9a');level=1+Math.floor(score/150);hud()}}}
  if(!e.dead&&inv<=0&&Math.hypot(e.x-ship.x,e.y-ship.y)<e.r+16){e.dead=1;lives--;inv=1.5;boom(ship.x,ship.y,'#ffd54a');hud();if(lives<=0){over();return}}
  if(!e.dead&&e.y>H+30){e.dead=1;score=Math.max(0,score-5);hud()}
 }
 if(boss){for(const b of bul)if(!b.d&&Math.abs(b.x-boss.x)<boss.r&&Math.abs(b.y-boss.y)<boss.r){b.d=1;boss.hp-=b.p||1;if(boss.hp<=0){score+=100;boom(boss.x,boss.y,'#ff9f43');for(let i=0;i<4;i++)boom(boss.x+(Math.random()-.5)*80,boss.y+(Math.random()-.5)*60,'#ff6b6b');pw.push({x:boss.x,y:boss.y,t:'h'});boss=null;level=1+Math.floor(score/150);snd(80,.5,'sawtooth');hud();break}}}
 bul=bul.filter(b=>!b.d);en=en.filter(e=>!e.dead);
 par.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});par=par.filter(p=>p.l>0);
 draw(dt);requestAnimationFrame(loop)}
function hit(){lives--;inv=1.5;boom(ship.x,ship.y,'#ffd54a');snd(120,.3,'sawtooth');hud();if(lives<=0)over()}
function over(){run=false;best=Math.max(best,score);msg.innerHTML='💥 Game Over!<br>Score: '+score+' | Best: '+best+'<br>Choose a mode to play again 👇';menu.style.display='flex'}
const TH=[{a:'#030a1f',b:'#0b2a6b',c:'#4aa3ff'},{a:'#12041f',b:'#4a1280',c:'#d27bff'},{a:'#1f0603',b:'#7a1f0f',c:'#ff7a4a'},{a:'#031a10',b:'#0f6b45',c:'#4aff9a'},{a:'#1a1203',b:'#7a5a0f',c:'#ffd24a'},{a:'#000000',b:'#2a2a3a',c:'#ffffff'}];
const NM=['Blue Space','Purple Nebula','Red Planet','Green Galaxy','Golden Storm','Dark Universe'];
const HC=[['#4aa3ff','#bfe3ff'],['#b46bff','#ecd2ff'],['#ff5a4a','#ffd0c8'],['#3fe08a','#c8ffe0'],['#ffc83a','#fff0b8'],['#ffffff','#9ad8ff']];
function drawShip(px,py){
 const c=HC[(level-1)%6],sc=1+Math.min(level,10)*.05;
 x.save();x.translate(px,py);x.scale(sc,sc);
 const f=10+Math.random()*10;
 x.fillStyle='#ff9f1a';x.beginPath();x.moveTo(-7,16);x.lineTo(0,24+f);x.lineTo(7,16);x.fill();
 x.fillStyle='#fff3a0';x.beginPath();x.moveTo(-3,16);x.lineTo(0,16+f);x.lineTo(3,16);x.fill();
 if(level>=4){x.strokeStyle=c[0];x.globalAlpha=.4;x.lineWidth=3;x.beginPath();x.arc(0,0,34,0,6.28);x.stroke();x.globalAlpha=1}
 x.fillStyle=c[0];
 x.beginPath();x.moveTo(-6,-4);x.lineTo(-28,18);x.lineTo(-26,24);x.lineTo(-6,14);x.closePath();x.fill();
 x.beginPath();x.moveTo(6,-4);x.lineTo(28,18);x.lineTo(26,24);x.lineTo(6,14);x.closePath();x.fill();
 if(level>=3){x.fillStyle='#555';x.fillRect(-22,2,4,16);x.fillRect(18,2,4,16);x.fillStyle=c[1];x.fillRect(-22,0,4,4);x.fillRect(18,0,4,4)}
 if(level>=5){x.fillStyle='#555';x.fillRect(-14,6,3,12);x.fillRect(11,6,3,12)}
 const g=x.createLinearGradient(-9,0,9,0);g.addColorStop(0,'#8a94a8');g.addColorStop(.5,'#ffffff');g.addColorStop(1,'#8a94a8');
 x.fillStyle=g;x.beginPath();x.moveTo(0,-30);x.quadraticCurveTo(10,-10,9,16);x.lineTo(-9,16);x.quadraticCurveTo(-10,-10,0,-30);x.fill();
 x.fillStyle=c[0];x.fillRect(-2,-6,4,20);
 x.fillStyle='#0b2a4a';x.beginPath();x.ellipse(0,-10,4.5,8,0,0,6.28);x.fill();
 x.fillStyle=c[1];x.globalAlpha=.7;x.beginPath();x.ellipse(-1.5,-13,1.5,3.5,0,0,6.28);x.fill();x.globalAlpha=1;
 x.restore();
 if(inv>2){x.strokeStyle='#66ccff';x.lineWidth=3;x.beginPath();x.arc(px,py,40,0,6.28);x.stroke()}}
function draw(dt){
 ban-=dt;tm+=dt;const th=TH[(level-1)%6];
 const bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,th.a);bg.addColorStop(1,th.b);x.fillStyle=bg;x.fillRect(0,0,W,H);
 const py=((tm*14)%(H+400))-200,pg=x.createRadialGradient(W*.75-20,py-20,5,W*.75,py,90);pg.addColorStop(0,th.c);pg.addColorStop(1,th.a);x.fillStyle=pg;x.beginPath();x.arc(W*.75,py,90,0,6.28);x.fill();
 x.globalAlpha=.12;x.fillStyle=th.c;x.beginPath();x.arc(W*.2,((tm*9)%(H+300))-100,120,0,6.28);x.fill();x.globalAlpha=1;
 x.fillStyle='#fff';stars.forEach(s=>{s.y+=s.s*40*dt;if(s.y>H){s.y=0;s.x=Math.random()*W}x.globalAlpha=.4+s.s/4;x.fillRect(s.x%W,s.y,s.s,s.s)});x.globalAlpha=1;
 x.fillStyle=HC[(level-1)%6][1];bul.forEach(b=>{const w=b.p>1?6:4;x.fillRect(b.x-w/2,b.y-8,w,14)});
 en.forEach(e=>{x.font=(e.r*2)+'px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(e.t?'👾':'🛸',e.x,e.y)});
 par.forEach(p=>{x.globalAlpha=p.l*2;x.fillStyle=p.c;x.fillRect(p.x,p.y,4,4)});x.globalAlpha=1;
 x.textAlign='center';x.textBaseline='middle';pw.forEach(p=>{x.font='28px serif';x.fillText(p.t=='f'?'⚡':p.t=='s'?'🛡️':'❤️',p.x,p.y)});x.fillStyle='#ff5252';eb.forEach(b=>{x.beginPath();x.arc(b.x,b.y,5,0,6.28);x.fill()});if(boss){x.font='96px serif';x.fillText('👹',boss.x,boss.y);x.fillStyle='#333';x.fillRect(boss.x-50,boss.y-62,100,8);x.fillStyle='#ff5252';x.fillRect(boss.x-50,boss.y-62,100*boss.hp/boss.m,8)}
 if(ban>0){x.globalAlpha=Math.min(1,ban);x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.font='bold 26px system-ui,sans-serif';x.fillText('Level '+level+': '+NM[(level-1)%6],W/2,H*.3);if(level>1){x.font='16px system-ui,sans-serif';x.fillText('Hero got stronger! 💪',W/2,H*.3+32)}x.globalAlpha=1}
 if(inv<=0||inv>2||Math.floor(inv*10)%2){drawShip(ship.x,ship.y)}
}
df=CF[0];init();draw(0);
</script>
<script>if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
</html>
